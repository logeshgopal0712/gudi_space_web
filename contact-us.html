<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch with the GudiSpace team." />
    <title>Contact us | GudiSpace</title>
    <link rel="stylesheet" href="styles.css?v=168" />
    <script src="navigation.js?v=168" defer></script>
  </head>
  <body>
    <header class="builder-header content-page-header">
      <nav class="builder-topbar" aria-label="GudiSpace navigation">
        <button class="builder-menu-toggle" id="builder-menu-toggle" type="button" aria-expanded="false" aria-controls="builder-navigation" aria-label="Open navigation"><span></span><span></span><span></span></button>
        <div class="builder-navigation" id="builder-navigation">
          <a href="index.html" data-config-text="navigation.home">Home</a>
          <a href="how-it-works.html" data-config-text="navigation.howItWorks">How it works</a>
          <a href="examples.html" data-navigation-key="examples" data-config-text="navigation.examples" hidden>Examples</a>
          <a href="pricing.html" data-navigation-key="pricing" data-config-text="navigation.pricing" hidden>Pricing</a>
          <a href="faq.html" data-config-text="navigation.faq">FAQ</a>
          <a href="manage_plan.html" data-navigation-key="managePlan" data-config-text="navigation.managePlan">Manage Plan</a>
          <a class="active" href="contact-us.html" data-config-text="navigation.contactUs">Contact us</a>
        </div>
      </nav>
      <div class="content-page-intro">
        <p class="eyebrow" data-config-text="brand.name">GudiSpace</p>
        <h1 data-config-text="headings.contactUs">Contact us</h1>
      </div>
    </header>
    <main class="content-page">
      <section class="home-panel contact-us-panel" id="contact-us">
        <form id="builder-contact-form">
          <div class="field-grid">
            <label>
              Name
              <input name="name" required placeholder="e.g. Alex Morgan" />
            </label>
            <label>
              Email
              <input name="email" type="email" required placeholder="e.g. alex@example.com" />
            </label>
            <label class="full-width">
              Message
              <textarea name="message" required rows="4" placeholder="e.g. Tell us how we can help"></textarea>
            </label>
          </div>
          <button class="home-panel-action" type="submit">Send message <span aria-hidden="true">→</span></button>
          <p id="contact-us-status" class="home-panel-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
